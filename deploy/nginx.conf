location = / {
    default_type text/plain;
    return 200 "SerrebiFdroid\n\nAdd this repository in F-Droid:\nhttps://fdroid.serrebiradio.com/fdroid/repo?fingerprint=REPOSITORY_FINGERPRINT\n\nOfficial Accessible IPTV releases.\nSource: https://github.com/serrebidev/SerrebiFdroid\n";
}

location = /repo {
    return 302 /fdroid/repo/$is_args$args;
}

location = /fdroid/repo {
    return 302 /fdroid/repo/$is_args$args;
}

location /repo/ {
    rewrite ^/repo/(.*)$ /fdroid/repo/$1 last;
}

location /fdroid/repo/ {
    root /var/www/serrebifdroid;
    autoindex on;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
    try_files $uri $uri/ =404;
}

location / {
    return 404;
}
