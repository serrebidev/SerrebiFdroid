Name: BlindRSS
Summary: TalkBack-first RSS reader and podcast player
Description: |-
  Read RSS, Atom, RDF, and JSON feeds, import and export OPML, and play
  podcasts with speed control, chapters, sleep timer, and offline downloads.
  Sync with Miniflux, FreshRSS, Inoreader, Feedbin, NewsBlur, and other
  hosted services, or keep feeds on the device.

  Designed for TalkBack, with labelled controls, headings, custom actions on
  article rows, and spoken sync announcements. Android port of BlindRSS.

  These are the developer's original GitHub release APKs, with their original
  signing certificate. Some optional sync services are non-free.
