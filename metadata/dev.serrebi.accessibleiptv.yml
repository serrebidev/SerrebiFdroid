Name: Accessible IPTV
Summary: Screen-reader-friendly IPTV for Android phones, tablets, and TV
Description: |-
  Play live TV, movies, and series from M3U playlists, Xtream Codes accounts,
  and Stalker portals. Browse XMLTV guides, use catch-up TV, record programmes,
  and cast to Chromecast or Google TV.

  Designed for TalkBack, Android screen readers, and TV remotes. Includes
  labelled controls, headings, spoken subtitles, and audio description support.
  Bring your own playlists and provider accounts; no channels are included.

  These are the developer's original GitHub release APKs, with their original
  signing certificate. The optional casting feature uses Google Cast libraries.
