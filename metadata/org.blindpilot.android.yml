Name: BlindPilot
Summary: Accessible AI chat for blind Android users
Description: |-
  Chat with AI models through cloud providers, a remote Hermes server, or
  offline GGUF models that run on the device. Device actions need your
  approval before they run.

  Built for TalkBack and Backtalk, with labelled controls and custom actions
  on chat messages. Bring your own provider accounts and API keys.

  These are the developer's original GitHub release APKs, with their original
  signing certificate. Cloud models use third-party network services.
